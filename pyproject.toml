[project]
name = "jvm-pybind"
version = "0.1.1"
description = "JVM bindings for Python that enable seamless integration between Python and Java code through JNI (Java Native Interface)."
readme = "README.md"
authors = [{ name = "t3tra-dev", email = "admin@t3tra.net" }]
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://pypi.org/project/jvm-pybind/"
Repository = "https://github.com/t3tra-dev/jvm-pybind"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "jvm-pybind",
    "pyright>=1.1.411",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.2",
    "setuptools>=80.9.0",
]

[tool.pyright]
include = ["src/jvm/**/*.py", "tests/**/*.py", "examples/**/*.py"]
exclude = ["**/__pycache__"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--color=yes",
    "--durations=10",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (slower, requires JVM)",
    "slow: Slow running tests",
    "skip_ci: Skip in CI environment",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]
minversion = "6.0"

[tool.uv.sources]
jvm = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["jvm"]
